name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # v7 runs on the Node 24 action runtime, which is what the runners now
      # default to — v4 was built for the deprecated Node 20 runtime.
      - uses: actions/setup-node@v7
        with:
          # The toolchain Node, separate from the action runtime above.
          # Angular 18 supports ^18.19.1 || ^20.11.1 || ^22.0.0, so 22 is the
          # newest it officially runs on; 24 would warn about the engine.
          node-version: 22
          cache: npm

      # Needs package-lock.json, which is committed. `npm ci` installs exactly
      # the locked tree — notably chokidar 3.6.0 at the root with 4.0.3 nested
      # under @angular/compiler-cli, which is the arrangement that actually
      # resolves. Letting the ^18.2.0 ranges float produces an invalid tree.
      - run: npm ci

      - name: Work out the base href
        id: base
        # A project site is served from /<repo>/, but a user or org site
        # (a repo literally named <user>.github.io) is served from the root.
        # Getting this wrong yields a blank page, so derive it rather than
        # hard-coding it.
        run: |
          REPO='${{ github.event.repository.name }}'
          if [[ "$REPO" == *.github.io ]]; then
            echo "href=/" >> "$GITHUB_OUTPUT"
          else
            echo "href=/$REPO/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build -- --base-href '${{ steps.base.outputs.href }}'

      - name: Prepare for Pages (404 fallback, .nojekyll)
        run: node tools/gh-pages-prep.mjs dist/browser

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
